<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vocabbit – Học từ vựng tiếng Anh</title>
  <link rel="icon" type="image/png" href="../assets/icons/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../user/css/welcome.css" />
</head>
<body>

  <!-- ===== Header ===== -->
  <header>
    <a href="/" class="logo">
      <img src="../assets/icons/logo.png" alt="Vocabbit logo" />
      Vocabbit
    </a>
  </header>

  <!-- ===== Nội dung chính ===== -->
  <main>
    <div class="hero-art">
      <div class="circle-bg"></div>

      <!-- Chú thỏ Vocabbit -->
      <img class="bunny" src="../assets/images/rabbit_welcome.png" alt="Thỏ Vocabbit" />

      <div class="word-card card-hello">
        <b>hello!</b>
        <span>xin chào</span>
      </div>
      <div class="word-card card-confident">
        <b>confident</b>
        <span>tự tin</span>
      </div>
    </div>

    <div class="hero-text">
      <h1 id="title">Cùng nhau khám phá từ vựng mỗi ngày, thêm <span class="highlight">tự tin.</span></h1>
      <!--<p id="subtitle">
        Khám phá từ vựng tiếng Anh mỗi ngày theo cách riêng của bạn. 
      </p>-->
      <!-- Đổi đường dẫn href cho khớp với trang đăng ký / đăng nhập của bạn -->
      <a href="onboarding.html" class="btn btn-primary" id="btnStart">Get started</a>
      <a href="login.html" class="btn btn-secondary" id="btnLogin">I already have an account</a>
    </div>
  </main>

  <script src="../user/js/welcome.js"></script>
</body>
</html>
