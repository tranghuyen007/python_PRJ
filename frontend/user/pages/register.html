<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vocabbit – Tạo tài khoản</title>
  <link rel="icon" type="image/png" href="../../assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body data-page="register">

  <!-- ===== Header ===== -->
  <header class="topbar">
    <a href="welcome.html" class="logo">
      Vocabbit
    </a>
    <a href="welcome.html" class="topbar-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12" /></svg>
      <span>Đóng</span>
    </a>
  </header>

  <!-- ===== Nội dung chính ===== -->
  <main>
    <div class="register-wrap">

      <!-- Bên trái: giới thiệu luồng học -->
      <section class="plan-card">
        <div class="plan-head">
          <img src="../../assets/icons/logo.png" alt="Thỏ Vocabbit" />
          <div>
            <p class="eyebrow">Học cùng Vocabbit</p>
            <h2>Bắt đầu từ cấp độ phù hợp với bạn.</h2>
          </div>
        </div>
        <p class="lead">Học từ vựng theo chủ đề, rồi làm bài kiểm tra đầu vào để mở khóa những cấp độ cao hơn.</p>
      </section>

      <!-- Bên phải: đăng ký bằng Gmail + mật khẩu -->
      <section class="register-form">
        <a href="login.html" class="back-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7" /></svg>
          Quay lại đăng nhập
        </a>

        <h1>Đăng ký</h1>

        <form id="registerForm" class="auth-form" novalidate>
          <div class="field">
            <label for="fullName">Tên</label>
            <input id="fullName" name="fullName" type="text" placeholder="Nhập tên của bạn" autocomplete="name" aria-describedby="fullNameMsg" />
            <p class="field-msg" id="fullNameMsg" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="gender">Giới tính</label>
            <select id="gender" name="gender">
              <option value="">Chọn giới tính</option>
              <option value="male">Nam</option>
              <option value="female">Nữ</option>
              <option value="other">Khác</option>
              <option value="private">Không muốn tiết lộ</option>
            </select>
          </div>

          <div class="field">
            <label for="email">Gmail</label>
            <input id="email" name="email" type="email" inputmode="email" placeholder="example@gmail.com" autocomplete="email" aria-describedby="emailMsg" />
            <p class="field-msg" id="emailMsg" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="password">Mật khẩu</label>
            <div class="input-wrap">
              <input id="password" name="password" type="password" placeholder="Nhập mật khẩu" autocomplete="new-password" aria-describedby="passwordMsg" />
              <button type="button" class="toggle-pw" aria-label="Hiện mật khẩu">
                <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3" /></svg>
                <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10 10 0 0 1 12 19c-6.5 0-10-7-10-7a18 18 0 0 1 5-5.9M9.9 4.2A9 9 0 0 1 12 4c6.5 0 10 7 10 7a18 18 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2M2 2l20 20" /></svg>
              </button>
            </div>
            <p class="field-msg" id="passwordMsg" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="confirm">Nhập lại mật khẩu</label>
            <div class="input-wrap">
              <input id="confirm" name="confirm" type="password" placeholder="Nhập lại mật khẩu" autocomplete="new-password" aria-describedby="confirmMsg" />
              <button type="button" class="toggle-pw" aria-label="Hiện mật khẩu">
                <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3" /></svg>
                <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10 10 0 0 1 12 19c-6.5 0-10-7-10-7a18 18 0 0 1 5-5.9M9.9 4.2A9 9 0 0 1 12 4c6.5 0 10 7 10 7a18 18 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2M2 2l20 20" /></svg>
              </button>
            </div>
            <p class="field-msg" id="confirmMsg" aria-live="polite"></p>
          </div>

          <p class="form-error" role="alert"></p>

          <button type="submit" class="btn btn-primary">
            <span class="btn-label">Tạo tài khoản</span>
          </button>
        </form>

        <!--<p class="safe-note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /><path d="M9 12l2 2 4-4" /></svg>
          Mật khẩu của bạn sẽ được bảo mật và chỉ dùng để đăng nhập vào tài khoản của bạn.
        </p>-->

        <!--<p class="small">Bằng việc đăng ký, bạn đồng ý với <a href="#">Điều khoản sử dụng</a> và <a href="#">Chính sách quyền riêng tư</a> của Vocabbit.</p>-->

        <div class="divider"></div>

        <p class="small">Đã có tài khoản Vocabbit?</p>
        <a href="login.html" class="strong-link">Đăng nhập bằng Gmail và mật khẩu →</a>
      </section>
    </div>
  </main>

  <script src="../js/auth.js"></script>
</body>
</html>
