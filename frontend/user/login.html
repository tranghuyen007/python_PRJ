<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vocabbit – Đăng nhập</title>
  <link rel="icon" type="image/png" href="../assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../user/css/auth.css" />
</head>
<body data-page="login">

  <!-- ===== Header ===== -->
  <header class="topbar">
    <a href="welcome.html" class="logo">
      Vocabbit
    </a>
    <a href="welcome.html" class="topbar-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12" /></svg>
      <span>Đóng</span>
    </a>
  </header>

  <!-- ===== Nội dung chính ===== -->
  <main>
    <section class="login-wrap">
      <img class="bunny" src="../assets/images/logo.png" alt="Thỏ Vocabbit" />

      <h1>Đăng nhập</h1>
      <!--<p class="lead">Bạn thỏ vẫn ở đây, sẵn sàng học cùng bạn!</p>-->

      <!--<div class="info-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9" /><path d="M12 11v5M12 8h0" /></svg>
        <span>Sử dụng Gmail và mật khẩu đã đăng ký để đăng nhập.<br />Nếu chưa có tài khoản, bạn có thể chuyển sang đăng ký.</span>
      </div>-->

      <form id="loginForm" class="auth-form login-card" novalidate>
        <div class="field">
          <label for="email">Gmail</label>
          <input id="email" name="email" type="email" inputmode="email" placeholder="example@gmail.com" autocomplete="email" aria-describedby="emailMsg" />
        </div>

        <div class="field">
          <label for="password">Mật khẩu</label>
          <div class="input-wrap">
            <input id="password" name="password" type="password" placeholder="Nhập mật khẩu" autocomplete="current-password" aria-describedby="passwordMsg" />
            <button type="button" class="toggle-pw" aria-label="Hiện mật khẩu">
              <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3" /></svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10 10 0 0 1 12 19c-6.5 0-10-7-10-7a18 18 0 0 1 5-5.9M9.9 4.2A9 9 0 0 1 12 4c6.5 0 10 7 10 7a18 18 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2M2 2l20 20" /></svg>
            </button>
          </div>
        </div>

        <p class="form-error" role="alert"></p>

        <button type="submit" class="btn btn-primary">
          <span class="btn-label">Đăng nhập</span>
        </button>
      </form>

      <div class="divider"></div>

      <p class="small">Chưa có tài khoản Vocabbit?</p>
      <a href="onboarding.html" class="strong-link">Bắt đầu lộ trình và đăng ký bằng Gmail →</a>
    </section>
  </main>



  <script src="../user/js/auth.js"></script>
</body>
</html>
